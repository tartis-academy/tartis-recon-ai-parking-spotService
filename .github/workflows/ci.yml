name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

# Si llegan dos push seguidos, cancela el run anterior: no interesa el
# resultado de un commit que ya esta superado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # El pom NO esta en la raiz del repo, vive aqui. Sin esto, mvnw no
    # encuentra proyecto y el job muere en el primer paso.
    defaults:
      run:
        working-directory: backend/spot-service

    services:
      # Postgres desechable, solo para este job. No tiene relacion con el
      # docker-compose.yml del repo: spring-boot-docker-compose esta
      # desactivado durante los tests (spring.docker.compose.skip.in-tests).
      #
      # Hace falta porque SpotServiceApplicationTests y SpotRestAdapterTest son
      # @SpringBootTest: levantan el contexto entero, JPA incluido, y sin
      # DataSource real no arrancan.
      #
      # Usuario, password y base deben coincidir con las variables SPOT_DB_*
      # del paso "Build + test", que son las que lee
      # src/test/resources/application.properties.
      postgres:
        image: postgres:15.18-alpine
        env:
          POSTGRES_USER: spot_user
          POSTGRES_PASSWORD: spot_pass
          POSTGRES_DB: spot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spot_user -d spot_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para calcular el
          # "new code" (blame por commit) al evaluar el quality gate.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          # El pom declara java.version=17 (bytecode target via
          # maven.compiler.release), pero el JDK del runner puede ser mas
          # nuevo: Lombok 1.18.30 compila bien con JDK 21 (no soporta JDK 25).
          # SonarQube Cloud dejo de aceptar analisis corridos con JDK 17, asi
          # que el runner tiene que ser 21+ para que el paso de sonar:sonar
          # no falle con "The version of Java (17) used to run this analysis
          # is deprecated".
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Los tests ya corren: SpotEntity tiene @Entity/@Id y el dominio esta
      # implementado, asi que el contexto de @SpringBootTest arranca.
      #
      # verify ya compila: no hace falta un paso de compile aparte.
      # jacoco-maven-plugin (pom.xml) genera target/site/jacoco/jacoco.xml
      # en esta misma fase, que es el reporte que consume SonarCloud.
      - name: Build + test
        env:
          SPOT_DB_HOST: localhost
          # El service container expone el 5432 directo. El 5434 del compose es
          # solo el mapeo en local para no chocar con otros Postgres.
          SPOT_DB_PORT: 5432
          SPOT_DB_NAME: spot_db
          SPOT_DB_USER: spot_user
          SPOT_DB_PASSWORD: spot_pass
        run: ./mvnw -B verify

      - name: Cache paquetes de SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Requiere el secret SONAR_TOKEN del repo.
      - name: Analisis SonarCloud (quality gate)
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.projectKey=1dd0rv_tartis-recon-ai-parking-spotService
          -Dsonar.organization=1dd0rv
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

  # RECON-813: escaneo de vulnerabilidades de la imagen final con Trivy.
  # Job separado y en paralelo a build: el Dockerfile hace su propio
  # 'mvn package' por dentro, meterlo como step secuencial duplicaria el build
  # Maven en el camino critico del pipeline.
  docker-scan:
    runs-on: ubuntu-latest

    # security-events: write es lo que permite subir el SARIF a la pestana
    # Security. Se declara aqui y no a nivel de workflow para que build siga
    # con el 'contents: read' minimo.
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # load: true deja la imagen en el daemon local para que Trivy la lea por
      # nombre; push: false, aqui no se publica nada. cache-from/to reutiliza
      # las capas (incluida la de dependencias Maven) entre runs.
      - name: Construir imagen
        uses: docker/build-push-action@v7.3.0
        with:
          context: backend/spot-service
          push: false
          load: true
          tags: spot-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Primero el SARIF con exit-code 0: asi el informe llega a la pestana
      # Security aunque el gate de abajo tumbe el job.
      - name: Trivy - informe SARIF (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spot-service:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Subir SARIF a la pestana Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # El gate real: solo CRITICAL tumba el job. Trivy lee automaticamente el
      # .trivyignore de la raiz del repo si existe, que es el mecanismo para
      # ignorar explicitamente una CVE concreta.
      - name: Trivy - quality gate (CRITICAL bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: spot-service:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL
          format: table
          exit-code: '1'
