spring.datasource.url=jdbc:h2:mem:spot_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.docker.compose.enabled=false

# SEC-06: este fichero tapa a src/main/resources/application.properties en el
# classpath de test, asi que application-dev.properties nunca se carga aqui y
# sin esto SecurityConfig no encuentra un bean JwtDecoder (ver vehicle-service,
# mismo problema en SEC-04). El valor no necesita ser alcanzable: los tests no
# llegan a decodificar ningun token de verdad, solo necesitan que el bean exista.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/parking
