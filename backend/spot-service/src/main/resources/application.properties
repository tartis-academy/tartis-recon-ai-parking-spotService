spring.application.name=spot-service

# Spring no lee el .env por su cuenta: hay que importarlo explicitamente.
# 'optional:' = si no existe el fichero, arranca igual (necesario en CI, donde
# las credenciales llegan como variables de entorno y no hay .env).
# '[.properties]' le dice a Spring que lo parsee como clave=valor aunque la
# extension no sea .properties.
spring.config.import=optional:file:.env[.properties]

# Perfil activo si nadie fija SPRING_PROFILES_ACTIVE (comodo en local). En el
# contenedor de produccion la variable SIEMPRE se fija explicitamente via
# compose/deploy, asi que este default nunca se usa ahi.
spring.profiles.default=dev

# La sesion de JPA NO sigue abierta durante el render de la respuesta.
# En arquitectura hexagonal la infraestructura no debe filtrarse a las capas de
# arriba: si algo no se cargo en el adapter, debe fallar ahi y no en el
# controlador. Ademas Spring avisa por consola si se deja el valor por defecto.
spring.jpa.open-in-view=false

# spring-boot-docker-compose (en el pom) arrancaria el docker-compose.yml solo
# y sobrescribiria la configuracion del perfil activo (dev/prod) con la del
# contenedor. Lo desactivamos: el README y setup.sh gestionan los contenedores
# a mano, y tener dos mecanismos compitiendo hace que estas propiedades se
# ignoren en silencio y no se entienda por que.
spring.docker.compose.enabled=false

# Actuator: solo el endpoint de health, sin exponer el resto (metrics, env...).
# 'probes.enabled' habilita /actuator/health/readiness y /liveness, que es a lo
# que apuntan los healthcheck de Docker/compose para saber si el servicio esta
# listo antes de enrutarle trafico.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# GW-06: mete el correlation-id y la identidad del llamante en cada linea de
# log. Sin esto los filtros funcionan pero nada de lo que ponen en el MDC se ve
# por ningun sitio, que es todo el objetivo del ticket.
#
# Que lleva cada hueco:
#   correlationId  lo pone CorrelationIdFilter, con el valor que genera Kong.
#                  Es lo que permite unir los logs de Kong y los de los cinco
#                  microservicios en una sola peticion.
#   userName       preferred_username del token verificado (RequestIdentityFilter).
#   clientId       claim azp: distingue si la llamada viene de un usuario por el
#                  frontend o de otro microservicio con client_credentials.
#
# El "anon" cubre /actuator y el perfil dev, donde no hay autenticacion y no hay
# nada que poner. El :- deja el hueco en blanco si la clave no esta, para que
# las lineas de arranque no salgan con un "null" delante.
#
# El patron por defecto de consola de Spring Boot ya reserva un hueco para esto,
# asi que basta con rellenarlo y no hay que redefinir el patron entero (que
# costaria los colores y el formato de Boot).
#
# Esta linea es IDENTICA en los cinco microservicios y se cambia en los cinco a
# la vez: descuadrarla en uno solo deja sus logs sin poder compararse con el
# resto, que es justo lo que GW-06 viene a resolver.
logging.pattern.correlation=[${spring.application.name:spot-service}] [%X{correlationId:-}] [%X{userName:-anon}@%X{clientId:-}]

# Swagger UI apunta al contrato escrito a mano (openapi.yml), no al spec que
# springdoc generaria escaneando los controladores: el contrato es la fuente de
# verdad. OJO: NO ponemos 'springdoc.api-docs.enabled=false', porque eso apaga
# tambien la propia Swagger UI (su auto-config depende de que api-docs este
# activo) y daria 404 en /swagger-ui/index.html. El endpoint generado
# /v3/api-docs sigue existiendo, pero la UI no lo muestra: solo pinta este url.
# El openapi.yml vive en la raiz del modulo; el build lo copia a static/ dentro
# del jar (ver maven-resources-plugin en el pom), asi hay una sola copia.
springdoc.swagger-ui.url=/openapi.yml

# RECON-812: las Postgres de demo/prod ya tenian tablas creadas por el
# schema.sql que se montaba como init script. baseline-on-migrate hace que,
# si Flyway encuentra un esquema no vacio sin su tabla de historial, marque
# V1 como ya aplicada en vez de fallar con "relation already exists".
spring.flyway.baseline-on-migrate=true

spring.datasource.url=jdbc:postgresql://localhost:5434/spot_db
spring.datasource.username=spot_user
spring.datasource.password=change.me
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# ASY-08: Dead letters de RabbitMQ: Reintentos con Backoff Exponencial y límite máximo de intentos
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=6
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000ms
spring.rabbitmq.listener.simple.concurrency=3
spring.rabbitmq.listener.simple.max-concurrency=5

# GW-06: logger dedicado del log de acceso (RequestLoggingFilter). Separado del
# resto para poder silenciarlo (level=WARN) sin perder los logs de negocio, o
# mandarlo a otro appender el dia que haya agregacion centralizada.
logging.level.http.access=INFO
