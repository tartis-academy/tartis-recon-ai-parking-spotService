# Perfil PROD.
#
# BD dedicada de este microservicio: database-per-service real (Convenciones
# del proyecto Parking S4). Sigue el patron SPOT_DB_* de S3, sin defaults
# comodos: en prod toda credencial llega por variable de entorno, nunca
# hardcodeada en un fichero versionado.
spring.datasource.url=jdbc:postgresql://${SPOT_DB_HOST}:${SPOT_DB_PORT:5432}/${SPOT_DB_NAME:spot_db}
spring.datasource.username=${SPOT_DB_USER}
spring.datasource.password=${SPOT_DB_PASSWORD}

# En prod no se toca el esquema en caliente. 'validate' hace fallar el
# arranque si el esquema no coincide con las entidades, en vez de alterarlo en
# silencio. RECON-812: el esquema ahora lo crea/versiona Flyway
# (src/main/resources/db/migration) al arrancar, ya no un schema.sql montado
# fuera de banda como init script de Postgres.
spring.jpa.hibernate.ddl-auto=validate

# Cinturon y tirantes: Boot ya desactiva devtools solo al detectar un jar
# empaquetado (que es como arranca el Dockerfile), pero lo dejamos explicito.
spring.devtools.restart.enabled=false

# SEC-06: a proposito NO hay aqui ni issuer-uri ni jwk-set-uri. Sin ellas
# Spring Boot no puede autoconfigurar el bean JwtDecoder y el arranque en
# perfil prod falla (mismo problema encontrado y corregido en tariff-service,
# PR #44). Infra ya las inyecta por variable de entorno en
# docker-compose.demo.yml (SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
# / ..._JWK_SET_URI, relaxed binding de Spring) para los 5 servicios,
# especificamente dejadas puestas para spot-service en cuanto este
# SecurityConfig entrase. Duplicar valores por defecto aqui solo arriesga que
# se desincronicen de esa fuente unica.
